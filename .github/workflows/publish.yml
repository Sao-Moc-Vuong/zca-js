name: publish

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18.x"
                  registry-url: "https://registry.npmjs.org"

            - run: npm install

            - name: Verify tag matches package.json version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/v}"
                  PKG_VERSION="$(node -p "require('./package.json').version")"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag v$TAG_VERSION does not match package.json version ($PKG_VERSION)"
                    exit 1
                  fi

            - run: npm run build:clean && npm run build:esm && npm run build:cjs

            - run: npm run lint

            - name: Resolve npm dist-tag from version
              id: npm_tag
              run: |
                  PKG_VERSION="$(node -p "require('./package.json').version")"
                  PRERELEASE="$(node -p "require('semver').prerelease('$PKG_VERSION')?.[0] || ''")"
                  echo "tag=${PRERELEASE:-latest}" >> "$GITHUB_OUTPUT"

            - name: Publish to npm
              run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
